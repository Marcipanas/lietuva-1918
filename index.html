<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lietuva 1918</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Build Lithuania from 1918: a 3D economy and city builder with free-form roads, railways, transport routes and seasons.">
<meta name="theme-color" content="#0f211d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lietuva 1918">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@500;600;700&family=Jost:wght@400;500;600&family=Spectral:ital,wght@0,400;1,400&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="ribbon" aria-hidden="true"></div>
    <div class="brand">Lietuva <b>1918</b></div>
    <div class="stats">
      <div class="st"><span class="k">Date</span><b id="t-date">16 Feb 1918</b><span class="sea" id="t-sea"></span></div>
      <div class="st"><span class="k">Treasury</span><b id="t-funds">3,000 Lt</b><span class="inc" id="t-inc"></span></div>
      <div class="st hide-s"><span class="k">Residents</span><b id="t-pop">—</b></div>
      <div class="st hide-s"><span class="k">Era</span><b id="t-era">Independence</b></div>
    </div>
    <div class="speed" role="group" aria-label="Game speed">
      <button id="sp-play" aria-label="Pause"></button><button id="sp-fast" aria-label="Speed">1×</button>
    </div>
  </header>
  <main class="stage" id="stage">
    <canvas id="cv" aria-label="3D map of Lithuania. Drag to move, pinch to zoom, twist two fingers to turn, tap to select."></canvas>
    <div id="labels"></div>
    <button id="compass" aria-label="Turn north up"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="n" d="M12 3l3.2 9H8.8z"/><path class="s" d="M12 21l-3.2-9h6.4z"/></svg></button>
    <div id="tut" role="status" aria-live="polite" hidden></div>
    <div id="hint" role="status" hidden></div>
    <div class="dock" id="dock">
      <button id="task" class="task" hidden></button>
      <div id="bar" role="region" aria-label="Tool" hidden></div>
      <nav id="nav" aria-label="Views"></nav>
    </div>
  </main>
  <aside class="side" id="side" aria-label="Details">
    <div class="grab" id="grab" aria-hidden="true"><i></i></div>
    <div class="shead" id="shead"></div>
    <div id="pbody"></div>
  </aside>
</div>
<div id="card" role="dialog" aria-modal="true" aria-labelledby="cardt" hidden></div>
<div class="toast" id="toast" role="status"></div>
<script src="vendor/three.min.js"></script>
<script src="js/common.js"></script>
<script src="js/data.js"></script>
<script src="js/geo.js"></script>
<script src="js/land.js"></script>
<script src="js/geom.js"></script>
<script src="js/terrain.js"></script>
<script src="js/world.js"></script>
<script src="js/world1918.js"></script>
<script src="js/sim.js"></script>
<script src="js/history.js"></script>
<script src="js/models.js"></script>
<script src="js/scene.js"></script>
<script src="js/agents.js"></script>
<script src="js/tools.js"></script>
<script src="js/input.js"></script>
<script src="js/panels.js"></script>
<script src="js/dash.js"></script>
<script src="js/tutorial.js"></script>
<script src="js/ui.js"></script>
<script>
/* Offline support: register the service worker when served over http(s). Not available inside claude.ai artifacts. */
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>
</body>
</html>
