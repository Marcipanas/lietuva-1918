name: Deploy to GitHub Pages
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
# On GitHub's free plan, Pages only works for public repositories, so the deploy job is skipped while the
# repository is private. With GitHub Pro you can publish from a private repository (the site is still public):
# then delete the `if:` line below.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Collect the site files
        run: mkdir _site && cp -r index.html sw.js manifest.webmanifest css js icons _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
